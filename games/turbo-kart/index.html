<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Turbo Kart Battle</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body, html { width: 100%; height: 100%; overflow: hidden; background: #08090D; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #fff; }
  #canvas { display: block; width: 100%; height: 100%; }

  .hud { position: absolute; pointer-events: none; }
  .hud-top { top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; }
  .hud-pill { background: rgba(17, 19, 27, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(8px); padding: 8px 18px; border-radius: 9999px; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
  .hud-pill b { color: #00D9FF; font-family: monospace; font-size: 16px; }

  .pos-badge { font-size: 24px; font-weight: 900; color: #FFB800; }

  /* Mobile Touch Controls */
  .mobile-ctrl { position: absolute; pointer-events: auto; display: none; }
  .steer-group { bottom: 24px; left: 24px; display: flex; gap: 14px; }
  .action-group { bottom: 24px; right: 24px; display: flex; gap: 14px; }
  .ctrl-btn { width: 64px; height: 64px; border-radius: 50%; background: rgba(23, 26, 37, 0.85); border: 2px solid rgba(0, 217, 255, 0.4); color: #fff; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .ctrl-btn:active { transform: scale(0.92); background: rgba(0, 217, 255, 0.3); }
  .btn-gas { border-color: #49F5A0; }
  .btn-weapon { border-color: #FF3366; background: rgba(255, 51, 102, 0.2); }

  /* Screens */
  .screen { position: absolute; inset: 0; background: rgba(8, 9, 13, 0.85); backdrop-filter: blur(12px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; padding: 20px; }
  .screen.hidden { display: none; }
  .screen h1 { font-size: clamp(32px, 5vw, 48px); font-weight: 900; margin-bottom: 8px; background: linear-gradient(135deg, #00D9FF, #9B5CFF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .screen p { color: #969BAD; max-width: 440px; margin-bottom: 24px; font-size: 15px; }
  .btn-play { background: linear-gradient(135deg, #00D9FF, #9B5CFF); border: none; color: #08090D; padding: 14px 36px; border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: 0 0 25px rgba(0, 217, 255, 0.5); transition: transform 0.2s; }
  .btn-play:hover { transform: scale(1.05); }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="hud hud-top">
  <div class="hud-pill">Position: <span class="pos-badge" id="pos-val">1st</span></div>
  <div class="hud-pill">Lap: <b id="lap-val">1 / 3</b></div>
  <div class="hud-pill">Item: <b id="item-val" style="color:#FFB800">EMPTY</b></div>
  <div class="hud-pill">Speed: <b id="speed-val">0 KM/H</b></div>
</div>

<!-- Mobile Touch Buttons -->
<div class="mobile-ctrl steer-group" id="mobile-steer">
  <div class="ctrl-btn" id="btn-left">◀</div>
  <div class="ctrl-btn" id="btn-right">▶</div>
</div>
<div class="mobile-ctrl action-group" id="mobile-actions">
  <div class="ctrl-btn btn-weapon" id="btn-fire">🚀</div>
  <div class="ctrl-btn" id="btn-brake">▼</div>
  <div class="ctrl-btn btn-gas" id="btn-gas">▲</div>
</div>

<!-- Start Screen -->
<div id="start-screen" class="screen">
  <h1>TURBO KART BATTLE</h1>
  <p>Burn rubber on the cyber circuit! Grab mystery combat crates, deploy rockets & mines, and claim 1st place in 3 laps.</p>
  <button class="btn-play" id="start-btn">START RACE</button>
</div>

<!-- Finish Screen -->
<div id="finish-screen" class="screen hidden">
  <h1 id="finish-title">RACE FINISHED!</h1>
  <p id="finish-sub">You placed 1st!</p>
  <button class="btn-play" id="restart-btn">RACE AGAIN (SPACE)</button>
</div>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const posVal = document.getElementById('pos-val');
  const lapVal = document.getElementById('lap-val');
  const itemVal = document.getElementById('item-val');
  const speedVal = document.getElementById('speed-val');
  const startScreen = document.getElementById('start-screen');
  const finishScreen = document.getElementById('finish-screen');
  const finishTitle = document.getElementById('finish-title');
  const finishSub = document.getElementById('finish-sub');

  let W = canvas.width = window.innerWidth;
  let H = canvas.height = window.innerHeight;
  window.addEventListener('resize', () => {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  });

  const isTouch = 'ontouchstart' in window;
  if (isTouch) {
    document.getElementById('mobile-steer').style.display = 'flex';
    document.getElementById('mobile-actions').style.display = 'flex';
  }

  function playSound(type) {
    if (window.parent && window.parent.NexoraSound) {
      if (type === 'hit') window.parent.NexoraSound.playHit();
      if (type === 'boost') window.parent.NexoraSound.playJump();
      if (type === 'rocket') window.parent.NexoraSound.playExplosion();
      if (type === 'powerup') window.parent.NexoraSound.playPowerup();
      if (type === 'win') window.parent.NexoraSound.playWin();
    }
  }

  // Track Circuit Definition (Waypoints loop)
  const trackPath = [
    { x: 300, y: 300 },
    { x: 1200, y: 300 },
    { x: 1600, y: 600 },
    { x: 1600, y: 1200 },
    { x: 1300, y: 1600 },
    { x: 500, y: 1600 },
    { x: 200, y: 1200 },
    { x: 200, y: 600 }
  ];
  const TRACK_WIDTH = 200;

  // Key controls
  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') {
      if (!inGame) startRace();
      else if (player) player.useItem();
    }
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  // Touch control bindings
  function bindTouch(id, code) {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('touchstart', e => { e.preventDefault(); keys[code] = true; });
    el.addEventListener('touchend', e => { e.preventDefault(); keys[code] = false; });
  }
  bindTouch('btn-gas', 'ArrowUp');
  bindTouch('btn-brake', 'ArrowDown');
  bindTouch('btn-left', 'ArrowLeft');
  bindTouch('btn-right', 'ArrowRight');
  document.getElementById('btn-fire').addEventListener('touchstart', e => {
    e.preventDefault();
    if (player) player.useItem();
  });

  // Mystery Crates
  const crates = [];
  function initCrates() {
    crates.length = 0;
    for (let i = 0; i < trackPath.length; i++) {
      const p1 = trackPath[i];
      const p2 = trackPath[(i + 1) % trackPath.length];
      crates.push({
        x: (p1.x + p2.x) / 2,
        y: (p1.y + p2.y) / 2,
        active: true,
        respawnTimer: 0
      });
    }
  }

  // Projectiles & Mines
  const projectiles = [];
  const mines = [];

  class Kart {
    constructor(name, color, isPlayer = false, x, y, angle = 0) {
      this.name = name;
      this.color = color;
      this.isPlayer = isPlayer;
      this.x = x;
      this.y = y;
      this.angle = angle;
      this.speed = 0;
      this.maxSpeed = 9;
      this.accel = 0.22;
      this.handling = 0.045;
      this.item = null;
      this.lap = 1;
      this.currentCheckpoint = 0;
      this.lapDist = 0;
      this.totalDist = 0;
      this.boostTimer = 0;
      this.shieldTimer = 0;
      this.spinTimer = 0;
    }

    useItem() {
      if (!this.item) return;
      if (this.item === 'BOOST') {
        this.boostTimer = 100;
        playSound('boost');
      } else if (this.item === 'ROCKET') {
        projectiles.push({
          x: this.x + Math.cos(this.angle) * 30,
          y: this.y + Math.sin(this.angle) * 30,
          angle: this.angle,
          speed: 16,
          owner: this
        });
        playSound('rocket');
      } else if (this.item === 'MINE') {
        mines.push({
          x: this.x - Math.cos(this.angle) * 30,
          y: this.y - Math.sin(this.angle) * 30,
          owner: this
        });
        playSound('hit');
      } else if (this.item === 'SHIELD') {
        this.shieldTimer = 240;
        playSound('powerup');
      }
      this.item = null;
      if (this.isPlayer) itemVal.textContent = 'EMPTY';
    }

    update() {
      if (this.spinTimer > 0) {
        this.spinTimer--;
        this.angle += 0.2;
        this.speed *= 0.9;
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        return;
      }

      if (this.boostTimer > 0) this.boostTimer--;
      if (this.shieldTimer > 0) this.shieldTimer--;

      const curMax = this.boostTimer > 0 ? this.maxSpeed * 1.6 : this.maxSpeed;

      if (this.isPlayer) {
        const up = keys['ArrowUp'] || keys['KeyW'];
        const down = keys['ArrowDown'] || keys['KeyS'];
        const left = keys['ArrowLeft'] || keys['KeyA'];
        const right = keys['ArrowRight'] || keys['KeyD'];

        if (up) this.speed = Math.min(this.speed + this.accel, curMax);
        else if (down) this.speed = Math.max(this.speed - this.accel * 0.8, -curMax * 0.4);
        else this.speed *= 0.96;

        if (Math.abs(this.speed) > 0.4) {
          const steerDir = this.speed > 0 ? 1 : -1;
          if (left) this.angle -= this.handling * steerDir;
          if (right) this.angle += this.handling * steerDir;
        }

        speedVal.textContent = `${Math.floor(Math.abs(this.speed) * 16)} KM/H`;
      } else {
        // AI Pathfinding to next waypoint
        const target = trackPath[this.currentCheckpoint];
        const targetAngle = Math.atan2(target.y - this.y, target.x - this.x);
        let diff = targetAngle - this.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        this.angle += Math.sign(diff) * Math.min(Math.abs(diff), this.handling * 0.9);
        this.speed = Math.min(this.speed + this.accel * 0.7, this.maxSpeed * 0.88);

        if (this.item && Math.random() < 0.02) this.useItem();
      }

      this.x += Math.cos(this.angle) * this.speed;
      this.y += Math.sin(this.angle) * this.speed;

      // Checkpoint progression
      const nextCp = trackPath[this.currentCheckpoint];
      if (Math.hypot(this.x - nextCp.x, this.y - nextCp.y) < 180) {
        this.currentCheckpoint = (this.currentCheckpoint + 1) % trackPath.length;
        if (this.currentCheckpoint === 0) {
          this.lap++;
          if (this.isPlayer) {
            lapVal.textContent = `${Math.min(3, this.lap)} / 3`;
            if (this.lap > 3) finishRace();
          }
        }
      }

      this.totalDist = (this.lap - 1) * trackPath.length + this.currentCheckpoint;
    }

    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);

      // Boost flame
      if (this.boostTimer > 0) {
        ctx.fillStyle = '#FFB800';
        ctx.beginPath();
        ctx.moveTo(-18, -6);
        ctx.lineTo(-32 - Math.random() * 8, 0);
        ctx.lineTo(-18, 6);
        ctx.fill();
      }

      // Shield sphere
      if (this.shieldTimer > 0) {
        ctx.strokeStyle = '#00D9FF';
        ctx.lineWidth = 3;
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#00D9FF';
        ctx.beginPath();
        ctx.arc(0, 0, 26, 0, Math.PI * 2);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      // Kart chassis
      ctx.fillStyle = this.color;
      ctx.shadowBlur = 10;
      ctx.shadowColor = this.color;
      ctx.fillRect(-14, -9, 28, 18);
      ctx.shadowBlur = 0;

      // Wheels
      ctx.fillStyle = '#11131B';
      ctx.fillRect(-12, -13, 8, 4);
      ctx.fillRect(6, -13, 8, 4);
      ctx.fillRect(-12, 9, 8, 4);
      ctx.fillRect(6, 9, 8, 4);

      // Driver helmet
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, 0, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  let inGame = false;
  let player = null;
  let racers = [];
  const camera = { x: 0, y: 0 };

  function startRace() {
    inGame = true;
    startScreen.classList.add('hidden');
    finishScreen.classList.add('hidden');
    initCrates();

    const pName = (window.parent && window.parent.NexoraGuest && window.parent.NexoraGuest.profile.name) || 'CyberRacer';
    player = new Kart(pName, '#00D9FF', true, 250, 300, 0);
    racers = [
      player,
      new Kart('VortexSpeed', '#FF3366', false, 250, 340, 0),
      new Kart('PhantomRider', '#9B5CFF', false, 210, 300, 0),
      new Kart('NitroTitan', '#49F5A0', false, 210, 340, 0)
    ];
  }

  document.getElementById('start-btn').addEventListener('click', startRace);
  document.getElementById('restart-btn').addEventListener('click', startRace);

  function finishRace() {
    inGame = false;
    const sorted = [...racers].sort((a, b) => b.totalDist - a.totalDist);
    const rank = sorted.indexOf(player) + 1;
    const suffix = rank === 1 ? '1st' : (rank === 2 ? '2nd' : (rank === 3 ? '3rd' : '4th'));
    const score = Math.max(100, 600 - (rank - 1) * 150);

    playSound('win');
    finishTitle.textContent = rank === 1 ? 'GRAND PRIX CHAMPION!' : 'PODIUM FINISH!';
    finishSub.textContent = `You placed ${suffix}! Final Score: ${score} PTS`;
    finishScreen.classList.remove('hidden');

    if (window.parent && window.parent.NexoraGuest) {
      window.parent.NexoraGuest.recordGameScore('turbo-kart', score);
    }
  }

  // Loop
  function loop() {
    ctx.fillStyle = '#08090D';
    ctx.fillRect(0, 0, W, H);

    if (inGame && player) {
      camera.x += (player.x - camera.x) * 0.1;
      camera.y += (player.y - camera.y) * 0.1;
    }

    ctx.save();
    ctx.translate(W / 2 - camera.x, H / 2 - camera.y);

    // Draw Track Surface
    ctx.strokeStyle = '#171A25';
    ctx.lineWidth = TRACK_WIDTH;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let i = 0; i <= trackPath.length; i++) {
      const p = trackPath[i % trackPath.length];
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();

    // Track Neon Borders
    ctx.strokeStyle = '#9B5CFF';
    ctx.lineWidth = 4;
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#9B5CFF';
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Checkpoint Start/Finish Line
    ctx.fillStyle = '#F5F6FA';
    ctx.fillRect(trackPath[0].x - 10, trackPath[0].y - TRACK_WIDTH / 2, 20, TRACK_WIDTH);

    // Crates
    crates.forEach(c => {
      if (c.active) {
        ctx.fillStyle = '#FFB800';
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#FFB800';
        ctx.fillRect(c.x - 12, c.y - 12, 24, 24);
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#08090D';
        ctx.font = 'bold 14px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('?', c.x, c.y + 5);

        // Pickup collision
        racers.forEach(k => {
          if (Math.hypot(k.x - c.x, k.y - c.y) < 28 && !k.item) {
            const items = ['BOOST', 'ROCKET', 'MINE', 'SHIELD'];
            k.item = items[Math.floor(Math.random() * items.length)];
            c.active = false;
            c.respawnTimer = 300;
            playSound('powerup');
            if (k.isPlayer) itemVal.textContent = k.item;
          }
        });
      } else {
        c.respawnTimer--;
        if (c.respawnTimer <= 0) c.active = true;
      }
    });

    // Projectiles
    for (let i = projectiles.length - 1; i >= 0; i--) {
      const pr = projectiles[i];
      pr.x += Math.cos(pr.angle) * pr.speed;
      pr.y += Math.sin(pr.angle) * pr.speed;

      ctx.fillStyle = '#FF3366';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#FF3366';
      ctx.beginPath();
      ctx.arc(pr.x, pr.y, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Hit test
      racers.forEach(k => {
        if (k !== pr.owner && Math.hypot(k.x - pr.x, k.y - pr.y) < 24) {
          if (k.shieldTimer <= 0) {
            k.spinTimer = 60;
            playSound('hit');
          }
          projectiles.splice(i, 1);
        }
      });
    }

    // Mines
    for (let i = mines.length - 1; i >= 0; i--) {
      const m = mines[i];
      ctx.fillStyle = '#FF3366';
      ctx.beginPath();
      ctx.arc(m.x, m.y, 10, 0, Math.PI * 2);
      ctx.fill();

      racers.forEach(k => {
        if (Math.hypot(k.x - m.x, k.y - m.y) < 22) {
          if (k.shieldTimer <= 0) {
            k.spinTimer = 75;
            playSound('rocket');
          }
          mines.splice(i, 1);
        }
      });
    }

    // Racers
    racers.forEach(r => {
      r.update();
      r.draw();
    });

    ctx.restore();

    // Position Tracker
    if (inGame && player) {
      const sorted = [...racers].sort((a, b) => b.totalDist - a.totalDist);
      const rank = sorted.indexOf(player) + 1;
      posVal.textContent = rank === 1 ? '1st' : (rank === 2 ? '2nd' : (rank === 3 ? '3rd' : '4th'));
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
