<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Snake Arena</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body, html { width: 100%; height: 100%; overflow: hidden; background: #08090D; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #fff; }
  #canvas { display: block; width: 100%; height: 100%; }
  
  /* HUD Overlay */
  .hud { position: absolute; pointer-events: none; }
  .hud-top-left { top: 16px; left: 16px; display: flex; flex-direction: column; gap: 6px; }
  .hud-pill { background: rgba(17, 19, 27, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 9999px; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
  .hud-pill b { color: #00D9FF; font-family: monospace; font-size: 16px; }
  
  .hud-top-right { top: 16px; right: 16px; width: 200px; background: rgba(17, 19, 27, 0.8); border: 1px solid rgba(155, 92, 255, 0.3); border-radius: 12px; padding: 12px; backdrop-filter: blur(8px); }
  .hud-top-right h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #9B5CFF; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 4px; }
  .lb-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
  .lb-row.me { color: #49F5A0; font-weight: 700; }
  
  /* Mobile Boost Button */
  #boost-btn { position: absolute; bottom: 30px; right: 30px; width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, #00D9FF, #9B5CFF); border: 2px solid #fff; box-shadow: 0 0 20px rgba(0, 217, 255, 0.5); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 13px; color: #08090D; pointer-events: auto; cursor: pointer; display: none; }
  #boost-btn:active { transform: scale(0.92); }

  /* Screens */
  .screen { position: absolute; inset: 0; background: rgba(8, 9, 13, 0.85); backdrop-filter: blur(12px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; padding: 20px; }
  .screen.hidden { display: none; }
  .screen h1 { font-size: clamp(32px, 5vw, 48px); font-weight: 900; margin-bottom: 8px; background: linear-gradient(135deg, #00D9FF, #9B5CFF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .screen p { color: #969BAD; max-width: 440px; margin-bottom: 24px; font-size: 15px; }
  .btn-play { background: linear-gradient(135deg, #9B5CFF, #00D9FF); border: none; color: #08090D; padding: 14px 36px; border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: 0 0 25px rgba(155, 92, 255, 0.5); transition: transform 0.2s; }
  .btn-play:hover { transform: scale(1.05); }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="hud hud-top-left">
  <div class="hud-pill">Length: <b id="score-val">15</b></div>
  <div class="hud-pill">Mode: <span id="mode-val" style="color:#49F5A0">Online Arena</span></div>
</div>

<div class="hud hud-top-right">
  <h4>Arena Leaderboard</h4>
  <div id="lb-list"></div>
</div>

<div id="boost-btn">BOOST</div>

<!-- Start Screen -->
<div id="start-screen" class="screen">
  <h1>SNAKE ARENA</h1>
  <p>Slither through the neon expanse, consume energy orbs, and eliminate opponents to climb the live leaderboard.</p>
  <button class="btn-play" id="start-btn">ENTER ARENA</button>
</div>

<!-- Game Over Screen -->
<div id="gameover-screen" class="screen hidden">
  <h1 style="background: linear-gradient(135deg, #FF3366, #9B5CFF); -webkit-background-clip: text;">SERPENT DOWN</h1>
  <p>Final Length: <b id="final-score" style="color:#00D9FF; font-size: 22px;">0</b></p>
  <button class="btn-play" id="respawn-btn">RESPAWN (SPACE)</button>
</div>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const scoreVal = document.getElementById('score-val');
  const lbList = document.getElementById('lb-list');
  const startScreen = document.getElementById('start-screen');
  const gameoverScreen = document.getElementById('gameover-screen');
  const finalScore = document.getElementById('final-score');
  const boostBtn = document.getElementById('boost-btn');

  // Resize canvas
  let W = canvas.width = window.innerWidth;
  let H = canvas.height = window.innerHeight;
  window.addEventListener('resize', () => {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  });

  if ('ontouchstart' in window) {
    boostBtn.style.display = 'flex';
  }

  const ARENA_RADIUS = 2600;
  let inGame = false;
  let score = 15;
  let boosting = false;

  // Sound helper
  function playSound(name) {
    if (window.parent && window.parent.NexoraSound) {
      if (name === 'collect') window.parent.NexoraSound.playCollect();
      if (name === 'hit') window.parent.NexoraSound.playHit();
      if (name === 'explosion') window.parent.NexoraSound.playExplosion();
      if (name === 'click') window.parent.NexoraSound.playClick();
    }
  }

  // Camera
  const camera = { x: 0, y: 0, scale: 1 };

  // Mouse coords
  const mouse = { x: W / 2, y: H / 2 };
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => { boosting = true; });
  window.addEventListener('mouseup', () => { boosting = false; });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') boosting = true;
    if (!inGame && e.code === 'Space') startGame();
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'Space') boosting = false;
  });

  // Touch
  boostBtn.addEventListener('touchstart', e => { e.preventDefault(); boosting = true; });
  boostBtn.addEventListener('touchend', e => { e.preventDefault(); boosting = false; });
  window.addEventListener('touchmove', e => {
    if (e.touches.length > 0) {
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
    }
  }, { passive: true });

  // Player Snake
  class Snake {
    constructor(name, color, isPlayer = false) {
      this.name = name;
      this.color = color;
      this.isPlayer = isPlayer;
      this.x = (Math.random() - 0.5) * 1500;
      this.y = (Math.random() - 0.5) * 1500;
      this.angle = Math.random() * Math.PI * 2;
      this.targetAngle = this.angle;
      this.length = 18;
      this.radius = 12;
      this.history = [];
      this.alive = true;
      for (let i = 0; i < 40; i++) {
        this.history.push({ x: this.x - Math.cos(this.angle) * i * 3, y: this.y - Math.sin(this.angle) * i * 3 });
      }
    }

    update() {
      if (!this.alive) return;
      const speed = (this.isPlayer && boosting && this.length > 10) ? 6.2 : 3.4;

      if (this.isPlayer) {
        const dx = mouse.x - W / 2;
        const dy = mouse.y - H / 2;
        this.targetAngle = Math.atan2(dy, dx);
      } else {
        // AI Snake Steering
        if (Math.random() < 0.03) {
          this.targetAngle += (Math.random() - 0.5) * 1.5;
        }
      }

      // Smooth angle interpolation
      let diff = this.targetAngle - this.angle;
      while (diff < -Math.PI) diff += Math.PI * 2;
      while (diff > Math.PI) diff -= Math.PI * 2;
      this.angle += diff * 0.1;

      this.x += Math.cos(this.angle) * speed;
      this.y += Math.sin(this.angle) * speed;

      // Arena boundary constraint
      const distFromCenter = Math.hypot(this.x, this.y);
      if (distFromCenter > ARENA_RADIUS - 50) {
        this.targetAngle = Math.atan2(-this.y, -this.x);
      }

      this.history.unshift({ x: this.x, y: this.y });
      const targetHistory = Math.floor(this.length * 3.5);
      while (this.history.length > targetHistory) {
        this.history.pop();
      }

      // Boost consumption
      if (this.isPlayer && boosting && Math.random() < 0.25 && this.length > 12) {
        this.length -= 0.15;
        score = Math.floor(this.length);
        scoreVal.textContent = score;
        spawnOrb(this.x, this.y, 1);
      }
    }

    draw() {
      if (!this.alive) return;
      // Draw Body
      ctx.lineWidth = this.radius * 2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = this.color;
      ctx.shadowBlur = 10;
      ctx.shadowColor = this.color;

      ctx.beginPath();
      for (let i = this.history.length - 1; i >= 0; i -= 2) {
        const p = this.history[i];
        if (i === this.history.length - 1) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Draw Head
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fill();

      // Eyes
      const eyeOffset = this.radius * 0.6;
      const leftEyeX = this.x + Math.cos(this.angle - 0.6) * eyeOffset;
      const leftEyeY = this.y + Math.sin(this.angle - 0.6) * eyeOffset;
      const rightEyeX = this.x + Math.cos(this.angle + 0.6) * eyeOffset;
      const rightEyeY = this.y + Math.sin(this.angle + 0.6) * eyeOffset;

      ctx.fillStyle = '#08090D';
      ctx.beginPath();
      ctx.arc(leftEyeX, leftEyeY, 3.5, 0, Math.PI * 2);
      ctx.arc(rightEyeX, rightEyeY, 3.5, 0, Math.PI * 2);
      ctx.fill();

      // Name Tag
      ctx.fillStyle = '#F5F6FA';
      ctx.font = 'bold 11px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(`${this.name} (${Math.floor(this.length)})`, this.x, this.y - this.radius - 8);
    }
  }

  // Orbs
  const orbs = [];
  const orbColors = ['#00D9FF', '#9B5CFF', '#49F5A0', '#FF3366', '#FFB800'];
  function spawnOrb(x, y, mass = 1) {
    orbs.push({
      x: x !== undefined ? x : (Math.random() - 0.5) * (ARENA_RADIUS * 1.8),
      y: y !== undefined ? y : (Math.random() - 0.5) * (ARENA_RADIUS * 1.8),
      color: orbColors[Math.floor(Math.random() * orbColors.length)],
      radius: mass > 1 ? 5.5 : 3.5,
      mass: mass
    });
  }

  for (let i = 0; i < 400; i++) spawnOrb();

  // Snakes Array
  let player = new Snake((window.parent && window.parent.NexoraGuest && window.parent.NexoraGuest.profile.name) || 'CyberViper', '#00D9FF', true);
  const bots = [
    new Snake('NeonApex', '#9B5CFF'),
    new Snake('ShadowPhantom', '#49F5A0'),
    new Snake('QuantumRider', '#FF3366'),
    new Snake('HyperGhost', '#FFB800')
  ];

  function startGame() {
    inGame = true;
    startScreen.classList.add('hidden');
    gameoverScreen.classList.add('hidden');
    player = new Snake((window.parent && window.parent.NexoraGuest && window.parent.NexoraGuest.profile.name) || 'CyberViper', '#00D9FF', true);
    score = 15;
    scoreVal.textContent = score;
    playSound('click');
  }

  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('respawn-btn').addEventListener('click', startGame);

  function gameOver() {
    inGame = false;
    playSound('explosion');
    finalScore.textContent = score;
    gameoverScreen.classList.remove('hidden');

    // Scatter mass
    for (let i = 0; i < player.history.length; i += 2) {
      spawnOrb(player.history[i].x, player.history[i].y, 2);
    }

    if (window.parent && window.parent.NexoraGuest) {
      window.parent.NexoraGuest.recordGameScore('snake-arena', score);
    }
  }

  // Game Loop
  function loop() {
    // Background Grid
    ctx.fillStyle = '#08090D';
    ctx.fillRect(0, 0, W, H);

    if (inGame) {
      player.update();
      // Smooth Camera follow
      camera.x += (player.x - camera.x) * 0.1;
      camera.y += (player.y - camera.y) * 0.1;
    }

    ctx.save();
    ctx.translate(W / 2 - camera.x, H / 2 - camera.y);

    // Arena Outer Boundary
    ctx.strokeStyle = '#9B5CFF';
    ctx.lineWidth = 8;
    ctx.shadowBlur = 25;
    ctx.shadowColor = '#9B5CFF';
    ctx.beginPath();
    ctx.arc(0, 0, ARENA_RADIUS, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Grid lines
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
    ctx.lineWidth = 1;
    const gridSize = 100;
    const minX = camera.x - W / 2 - 100;
    const maxX = camera.x + W / 2 + 100;
    const minY = camera.y - H / 2 - 100;
    const maxY = camera.y + H / 2 + 100;

    for (let x = Math.floor(minX / gridSize) * gridSize; x < maxX; x += gridSize) {
      ctx.beginPath(); ctx.moveTo(x, minY); ctx.lineTo(x, maxY); ctx.stroke();
    }
    for (let y = Math.floor(minY / gridSize) * gridSize; y < maxY; y += gridSize) {
      ctx.beginPath(); ctx.moveTo(minX, y); ctx.lineTo(maxX, y); ctx.stroke();
    }

    // Update & Draw Orbs
    for (let i = orbs.length - 1; i >= 0; i--) {
      const o = orbs[i];
      ctx.fillStyle = o.color;
      ctx.shadowBlur = 8;
      ctx.shadowColor = o.color;
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.radius, 0, Math.PI * 2);
      ctx.fill();

      // Check player orb collision
      if (inGame && player.alive) {
        if (Math.hypot(player.x - o.x, player.y - o.y) < player.radius + o.radius + 6) {
          player.length += o.mass * 0.6;
          score = Math.floor(player.length);
          scoreVal.textContent = score;
          playSound('collect');
          orbs.splice(i, 1);
          spawnOrb();
        }
      }
    }
    ctx.shadowBlur = 0;

    // Update & Draw Bots
    bots.forEach(bot => {
      bot.update();
      bot.draw();

      // Bot collision with player body
      if (inGame && player.alive && bot.alive) {
        for (let j = 4; j < player.history.length; j += 3) {
          if (Math.hypot(bot.x - player.history[j].x, bot.y - player.history[j].y) < bot.radius + 8) {
            bot.alive = false;
            playSound('hit');
            for (let k = 0; k < bot.history.length; k += 2) spawnOrb(bot.history[k].x, bot.history[k].y, 2);
            setTimeout(() => {
              bot.alive = true;
              bot.x = (Math.random() - 0.5) * 1200;
              bot.y = (Math.random() - 0.5) * 1200;
              bot.length = 18;
            }, 3000);
          }
        }

        // Player collision with bot body
        for (let j = 4; j < bot.history.length; j += 3) {
          if (Math.hypot(player.x - bot.history[j].x, player.y - bot.history[j].y) < player.radius + 8) {
            player.alive = false;
            gameOver();
          }
        }
      }
    });

    if (inGame && player.alive) {
      player.draw();
    }

    ctx.restore();

    // Render leaderboard
    if (Math.random() < 0.05) {
      const allSnakes = [player, ...bots].sort((a, b) => b.length - a.length);
      lbList.innerHTML = allSnakes.map((s, idx) => `
        <div class="lb-row ${s.isPlayer ? 'me' : ''}">
          <span>#${idx + 1} ${s.name}</span>
          <b>${Math.floor(s.length)}</b>
        </div>
      `).join('');
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
