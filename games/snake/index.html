<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Snake</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d17; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
  #wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  #hud { font-size: 15px; display: flex; gap: 24px; }
  canvas { background: #12162a; border: 2px solid #2b3260; border-radius: 10px; touch-action: none; max-width: 96vw; max-height: 80vh; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div>
  <canvas id="c" width="400" height="400"></canvas>
</div>
<script>
(() => {
  const N = 20, S = 20;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
  let best = 0;
  try { best = +localStorage.getItem('snake-best') || 0; } catch (e) {}
  bestEl.textContent = best;

  let snake, dir, nextDir, food, score, alive, started, timer;

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 }; nextDir = dir;
    score = 0; alive = true; started = false;
    scoreEl.textContent = 0;
    placeFood();
    clearInterval(timer);
    draw();
  }

  function placeFood() {
    do { food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
    while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function speed() { return Math.max(60, 130 - score * 3); }

  function start() {
    started = true;
    clearInterval(timer);
    timer = setInterval(tick, speed());
  }

  function tick() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N || snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      placeFood();
      start(); // refresh speed
    } else {
      snake.pop();
    }
    draw();
  }

  function gameOver() {
    alive = false;
    clearInterval(timer);
    if (score > best) {
      best = score; bestEl.textContent = best;
      try { localStorage.setItem('snake-best', best); } catch (e) {}
    }
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#ff4d4d';
    ctx.beginPath(); ctx.arc(food.x * S + S / 2, food.y * S + S / 2, S / 2 - 2, 0, 7); ctx.fill();
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#7dffb0' : '#3ddc84';
      ctx.fillRect(s.x * S + 1, s.y * S + 1, S - 2, S - 2);
    });
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    if (!started && alive) { ctx.font = '18px system-ui'; ctx.fillText('Press an arrow key or swipe to start', 200, 200); }
    if (!alive) {
      ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, 400, 400);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 28px system-ui'; ctx.fillText('Game over', 200, 185);
      ctx.font = '16px system-ui'; ctx.fillText('Score ' + score + '  -  Space or tap to retry', 200, 215);
    }
  }

  function turn(x, y) {
    if (!alive) return;
    if (x === -dir.x && y === -dir.y) return; // no 180 turns
    nextDir = { x, y };
    if (!started) start();
  }

  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (['arrowup', 'w'].includes(k)) turn(0, -1);
    else if (['arrowdown', 's'].includes(k)) turn(0, 1);
    else if (['arrowleft', 'a'].includes(k)) turn(-1, 0);
    else if (['arrowright', 'd'].includes(k)) turn(1, 0);
    else if (k === ' ' && !alive) reset();
    if (k.startsWith('arrow') || k === ' ') e.preventDefault();
  });

  let t0 = null;
  cv.addEventListener('touchstart', e => { t0 = e.touches[0]; if (!alive) reset(); }, { passive: true });
  cv.addEventListener('touchend', e => {
    if (!t0) return;
    const t1 = e.changedTouches[0], dx = t1.clientX - t0.clientX, dy = t1.clientY - t0.clientY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 20) {
      Math.abs(dx) > Math.abs(dy) ? turn(dx > 0 ? 1 : -1, 0) : turn(0, dy > 0 ? 1 : -1);
    }
    t0 = null;
  });
  cv.addEventListener('click', () => { if (!alive) reset(); });

  reset();
})();
</script>
</body>
</html>
